services:
  db:
    platform: linux/amd64
    image: postgis/postgis:18-3.6@sha256:ea49d706470cfe1215c4f1e074fcab66d5af52f80adaf90d5a9beace71cd5ce8
    environment:
      POSTGRES_DB: kmk
      POSTGRES_USER: kmk_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - '127.0.0.1:${KMK_LOCAL_PORT:-54329}:5432'
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U kmk_admin -d kmk']
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    cpus: 1.0
secrets:
  db_password:
    file: ${KMK_LOCAL_PASSWORD_FILE:?Run pnpm geo:local start or test:geo}
volumes:
  database:
